# Headless service required by the StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nimbus
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
# Normal ClusterIP for the backend to connect to: redis-rw:6379
apiVersion: v1
kind: Service
metadata:
  name: redis-rw
  namespace: nimbus
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
