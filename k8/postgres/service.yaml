# Headless service required by the StatefulSet (stable pod DNS: postgres-0.postgres)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nimbus
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
---
# Normal ClusterIP for the backend to connect to: postgres-rw:5432
apiVersion: v1
kind: Service
metadata:
  name: postgres-rw
  namespace: nimbus
spec:
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
