# The one public entry point for users' apps. Each public container adds an HTTPRoute in its app's namespace
# (the worker does that); only namespaces Nimbus manages may attach, so nobody else can put routes on this Gateway.
#
# Envoy Gateway is the controller here, but nothing in Nimbus depends on it: any Gateway API controller can serve
# this Gateway. The Envoy Service is a NodePort on a fixed port so a local kind cluster can forward localhost:80 to it.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nimbus
  namespace: nimbus-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  nodePort: 30080
                  protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nimbus
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: nimbus
    namespace: nimbus-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nimbus
  namespace: nimbus-gateway
spec:
  gatewayClassName: nimbus
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/managed-by: nimbus
