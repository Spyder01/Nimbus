name: Build and publish backend image

# Builds the UI, embeds it in the backend jar, and publishes the backend Docker image to Docker Hub.
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token).
# Optional repository variable: DOCKERHUB_IMAGE (default: <DOCKERHUB_USERNAME>/nimbus-backend).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Backend tests run against real Postgres/Redis.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: nimbus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nimbus" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Dummy OAuth values: tests never talk to GitHub, but the app requires the properties to exist.
      GITHUB_CLIENT_ID: ci
      GITHUB_CLIENT_SECRET: ci
      POSTGRES_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      # 1. UI
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build UI
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      # 2. Backend (Gradle copies frontend/dist into the jar under /static)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test backend with the UI embedded
        working-directory: services/backend
        run: ./gradlew build --no-daemon
      - name: Verify the UI is inside the jar
        working-directory: services/backend
        run: unzip -l build/libs/app.jar | grep -q 'BOOT-INF/classes/static/index.html'

      # 3. Docker image
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image name
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_VAR: ${{ vars.DOCKERHUB_IMAGE }}
        run: echo "name=${IMAGE_VAR:-${DOCKERHUB_USERNAME:-local}/nimbus-backend}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (and push, except on pull requests)
        uses: docker/build-push-action@v6
        with:
          context: services/backend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
