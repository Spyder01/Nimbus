name: Build and publish worker image

# Tests the Go worker and publishes its Docker image to Docker Hub.
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token).
# Optional repository variable: DOCKERHUB_WORKER_IMAGE (default: <DOCKERHUB_USERNAME>/nimbus-worker).
#
# The image needs these at run time (set them on the container, never in the image):
#   POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
# and takes these optional ones (defaults are baked into the image, see services/worker/Dockerfile):
#   WORKER_POOL, WORKER_NAME, WORKER_PARALLEL_JOBS, WORKER_LEASE_SECONDS, WORKER_HTTP_PORT

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['services/worker/**', '.github/workflows/worker-image.yml']
  pull_request:
    paths: ['services/worker/**', '.github/workflows/worker-image.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: services/worker

    steps:
      - uses: actions/checkout@v4

      # 1. Go
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/worker/go.mod
          cache-dependency-path: services/worker/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

      # 2. Docker image
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image name
        id: image
        working-directory: .
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_VAR: ${{ vars.DOCKERHUB_WORKER_IMAGE }}
        run: echo "name=${IMAGE_VAR:-${DOCKERHUB_USERNAME:-local}/nimbus-worker}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (and push, except on pull requests)
        uses: docker/build-push-action@v6
        with:
          context: services/worker
          platforms: linux/amd64,linux/arm64
          # Shown by /actuator/info: the tag for a release, otherwise the short commit.
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
