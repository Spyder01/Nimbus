server:
  # Behind an ingress/load balancer: honour X-Forwarded-* so OAuth redirect URIs use the public https host.
  forward-headers-strategy: framework
app:
  redis:
    # true: HTTP sessions are stored in Redis. false: in-memory sessions, Redis not required.
    enabled: ${REDIS_ENABLED:false}
spring:
  autoconfigure:
    exclude: org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
  application:
    name: backend
  config:
    # Local dev: load services/backend/.env (gitignored) when present.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nimbus}
    username: ${POSTGRES_USER:nimbus}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # A deployment inserts one task per container; send them in a few round trips, not one per row.
        jdbc.batch_size: 50
        order_inserts: true
  modulith:
    events:
      republish-outstanding-events-on-restart: true
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
management:
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      # 'redis' stays in the readiness group but doesn't exist when REDIS_ENABLED=false
      validate-group-membership: false
      group:
        readiness:
          include: readinessState,db,redis

nimbus:
  deployments:
    # Total times a deployment may be claimed. A stale lease re-queues it until this is reached, then it FAILS.
    max-attempts: 3
    # Fixed lease: a claimed deployment must finish within this. Heartbeats do not extend it.
    lease-duration: 30m
    # A claimed deployment with no heartbeat for this long is treated as abandoned.
    heartbeat-timeout: 2m
